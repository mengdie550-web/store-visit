<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4a6cf7"><meta name="description" content="四川7家门店线下巡店信息：10月22日至24日走访安排、上月业绩、平台毛利、评分与问题记录。"><title>四川巡店 · 门店明细</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#20243a;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;padding-bottom:32px}a{color:inherit;text-decoration:none}button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer}header{background:linear-gradient(125deg,#456af4,#715ce0);color:white;padding:30px 20px 26px}header .wrap,main{max-width:760px;margin:auto}header small{font-size:11px;letter-spacing:2px;opacity:.8}h1{font-size:27px;margin:7px 0}header p{margin:4px 0;color:#e4e7ff;font-size:14px}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px}.share{background:#ffffff20;border:1px solid #ffffff60;color:white;border-radius:9px;padding:8px 12px;font-size:12px;white-space:nowrap}main{padding:16px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}.summary>div{background:white;border:1px solid #e9eaf3;border-radius:12px;padding:13px 10px}.summary b{display:block;font-size:22px;color:#4a60d2}.label{font-size:12px;color:#747b8e}.toolbar{position:sticky;top:0;z-index:5;background:#f5f6faf5;padding:10px 0 12px}.search{width:100%;border:1px solid #dfe3ef;border-radius:11px;background:white;padding:12px;font-size:16px}.filters{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.filters button{background:white;border:1px solid #dfe3ef;color:#61697e;border-radius:20px;padding:7px 13px;font-size:13px}.filters button.active{background:#4a6cf7;color:white;border-color:#4a6cf7}.section-heading{font-size:13px;color:#747b8e;margin:5px 0 12px;display:flex;justify-content:space-between}.card,.section{display:block;background:white;border:1px solid #e6e8f0;border-radius:14px;padding:18px;margin-bottom:12px;box-shadow:0 2px 5px #26305a04}.card:active{background:#f0f3ff}.card h2{font-size:17px;margin:0}.arrow{font-size:24px;color:#a0a7b8}.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 13px}.tag{font-size:11px;border-radius:5px;background:#f1f3f8;color:#697288;padding:3px 8px}.tag.date{background:#eef0ff;color:#5d62c8}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metrics b{display:block;font-size:19px;font-variant-numeric:tabular-nums}.issue-preview{margin-top:14px;padding-top:12px;border-top:1px solid #f0f1f6;font-size:12px;color:#aa6530}.quiet{color:#8b92a2}.section h2{font-size:16px;margin:0 0 13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.cell{background:#f7f8fc;border-radius:9px;padding:10px 12px;min-width:0}.cell b{display:block;font-size:16px;font-weight:600}.total{margin-top:12px;background:#eef1ff;padding:12px;border-radius:9px;display:flex;justify-content:space-between;color:#465bd4}.total b{font-size:20px}.bar{height:9px;background:#efa84f;border-radius:10px;overflow:hidden;margin:15px 0 7px}.bar div{height:100%;background:#5573f5}.legend{display:flex;justify-content:space-between;font-size:12px;color:#747b8e}table{width:100%;border-collapse:collapse;font-size:14px;text-align:right}th,td{padding:11px 4px;border-bottom:1px solid #edf0f5}th{font-size:12px;color:#7c8293;font-weight:500}th:first-child,td:first-child{text-align:left}tr:last-child td{border-bottom:0}.issue-box{background:#fff8ec;border:1px solid #f8e6c9;padding:13px;border-radius:10px;color:#945a24}.issue-box p{margin:0}.note{font-size:12px;color:#858b9b;margin:15px 3px}.back{display:inline-block;color:#eceeff;margin-bottom:12px;font-size:14px}.nav{display:flex;gap:10px}.nav a{background:white;border:1px solid #dfe3ef;color:#4a6cf7;padding:11px;border-radius:9px;flex:1;text-align:center;font-size:13px}.empty{text-align:center;padding:40px;color:#747b8e}.toast{position:fixed;bottom:35px;left:50%;transform:translateX(-50%);background:#20243a;color:white;border-radius:10px;padding:10px 18px;z-index:30;max-width:90%;font-size:13px}.footer{text-align:center;color:#9298a7;font-size:11px;margin-top:25px}.overview{margin-bottom:12px}details summary{cursor:pointer;font-size:14px;color:#4a60d2}details .grid{margin-top:13px}.badge{background:#fff4e4;color:#a86a29;padding:2px 7px;border-radius:5px;font-size:11px}@media(max-width:370px){main{padding:12px}.card,.section{padding:14px}h1{font-size:23px}.metrics b{font-size:17px}.summary b{font-size:20px}}@media(min-width:700px){header{padding-top:40px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{margin:0}.card:last-child{margin-bottom:12px}}
</style></head><body><div id="app"></div><script>
const STORES = [
{name:'广安吾悦广场店',city:'广安',district:'广安区',date:'10.22',delivery:27981.98,dine:26832.67,rank:['5/38','11/54'],margin:[41.60,45.91,null],rating:[4.4,4.6],issues:['淘宝消息回复率88%','20:50歇业，营业时间短','美团毛利略低']},
{name:'华蓥滨河西路店',city:'广安',district:'华蓥',date:'10.22',delivery:37082.19,dine:8046.06,rank:['1/23','1/15'],margin:[45.92,44.51,49.19],rating:[4.2,4.6],issues:['美团评分低']},
{name:'广安民兴街店',city:'广安',district:'前锋区',date:'10.22',delivery:14898.42,dine:12405.75,rank:['3/16','7/20'],margin:[43.02,45.57,51.11],rating:[4.5,4.6],issues:[]},
{name:'眉山金悦汇店',city:'眉山',district:'东坡区',date:'10.23',delivery:29176.43,dine:9724.06,rank:['8/13','2/16'],margin:[58.17,48.97,44.95],rating:[4.6,4.5],issues:['美团起送为16元','有拼好饭市场但门店未上线']},
{name:'眉山文忠街店',city:'眉山',district:'东坡区',date:'10.24',delivery:70475.64,dine:12601.64,rank:['12/60','9/70'],margin:[47.37,46.49,45.47],rating:[4.5,4.2],issues:['淘宝评分低','打包不规范（上季度卡片违规2次）']},
{name:'眉山中学店',city:'眉山',district:'东坡区',date:'10.24',delivery:34857.47,dine:10432.1,rank:['15/41','23/70'],margin:[47.30,43.68,46.07],rating:[4.6,4.5],issues:[]},
{name:'眉山锦江大学店',city:'眉山',district:'彭山区',date:'10.24',delivery:41548.26,dine:11279.4,rank:['2/21','7/25'],margin:[59.15,49.63,46.89],rating:[4.7,4.7],issues:[]}
];

const app=document.getElementById('app');
const money=n=>'¥'+n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const percent=n=>n===null?'—':n.toFixed(2)+'%';
let filter='全部',query='';
function header(title,sub,back=false){return `<header><div class="wrap">${back?'<a class="back" href="#home">‹ 返回门店列表</a>':'<small>STORE VISIT · SICHUAN</small>'}<div class="heading"><h1>${title}</h1><button class="share" id="share">复制链接</button></div><p>${sub}</p></div></header>`}
function cell(label,value){return `<div class="cell"><span class="label">${label}</span><b>${value}</b></div>`}
function home(){const delivery=STORES.reduce((t,s)=>t+s.delivery,0),dine=STORES.reduce((t,s)=>t+s.dine,0);app.innerHTML=header('巡店门店明细','四川 · 广安 / 眉山　｜　10月22日—24日')+`<main><div class="summary"><div><span class="label">本次走访</span><b>7 <small>家</small></b></div><div><span class="label">行程安排</span><b>3 <small>天</small></b></div><div><span class="label">有问题记录</span><b>4 <small>家</small></b></div></div><details class="section overview"><summary>上月业绩汇总 · ${money(delivery+dine)}</summary><div class="grid">${cell('外卖实收合计',money(delivery))}${cell('堂食实收合计',money(dine))}</div><p class="note">汇总为7家门店外卖实收与堂食实收相加，非利润。</p></details><div class="toolbar"><input class="search" id="search" aria-label="搜索门店、城市或区县" placeholder="搜索门店、城市或区县…"><div class="filters">${['全部','10.22','10.23','10.24','有问题记录'].map(f=>`<button data-filter="${f}" class="${f===filter?'active':''}">${f}</button>`).join('')}</div></div><div class="section-heading"><span id="count"></span><span>督导：杨凤云 · 点击查看详情</span></div><div id="list" class="cards"></div><p class="note">数据来自本次巡店信息表。日期沿用原表月日，原表未标注年份；“上月业绩”与“10.1—10.20线上毛利”分别展示。</p><div class="footer">四川线下巡店 · 门店信息汇总</div></main>`;document.getElementById('search').value=query;document.getElementById('search').oninput=e=>{query=e.target.value;cards()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));cards()});cards();bindShare()}
function cards(){const list=STORES.map((s,i)=>({s,i})).filter(({s})=>(filter==='全部'||filter===s.date||(filter==='有问题记录'&&s.issues.length))&&`${s.name}${s.city}${s.district}`.includes(query.trim()));document.getElementById('count').textContent=`显示 ${list.length} / 7 家门店`;document.getElementById('list').innerHTML=list.length?list.map(({s,i})=>`<a class="card" href="#store-${i}"><div class="heading"><h2>${s.name}</h2><span class="arrow">›</span></div><div class="tags"><span class="tag date">${s.date} 走访</span><span class="tag">${s.city} · ${s.district}</span></div><div class="metrics"><div><span class="label">上月实收合计</span><b>${money(s.delivery+s.dine)}</b></div><div><span class="label">美团 / 淘宝评分</span><b>${s.rating.map(n=>n.toFixed(1)).join(' / ')}</b></div></div><div class="issue-preview ${s.issues.length?'':'quiet'}">${s.issues.length?'● '+s.issues.join('；'):'原表未填写问题'}</div></a>`).join(''):'<div class="empty">未找到符合条件的门店<br>试试其他关键词或日期</div>'}
function detail(i){const s=STORES[i],total=s.delivery+s.dine,p=s.delivery/total*100;app.innerHTML=header(s.name,`四川 · ${s.city} · ${s.district}`,true)+`<main><section class="section"><h2>门店信息</h2><div class="grid">${cell('走访时间',s.date)}${cell('督导','杨凤云')}${cell('省份 / 城市','四川 / '+s.city)}${cell('区县',s.district)}</div></section><section class="section"><h2>上月业绩</h2><div class="grid">${cell('外卖实收',money(s.delivery))}${cell('堂食实收',money(s.dine))}</div><div class="total"><span>实收合计</span><b>${money(total)}</b></div><div class="bar"><div style="width:${p}%"></div></div><div class="legend"><span>外卖占比 ${p.toFixed(1)}%</span><span>堂食占比 ${(100-p).toFixed(1)}%</span></div><p class="note">合计与占比根据原表实收计算。</p></section><section class="section"><h2>商圈排名</h2><div class="grid">${cell('美团',s.rank[0])}${cell('淘宝',s.rank[1])}</div><p class="note">保留原表“排名 / 总数”的展示格式。</p></section><section class="section"><h2>线上毛利 <span class="tag date">10.1—10.20</span></h2><table><thead><tr><th>平台</th><th>毛利比例</th></tr></thead><tbody>${['美团','淘宝','京东'].map((n,j)=>`<tr><td>${n}</td><td>${percent(s.margin[j])}</td></tr>`).join('')}</tbody></table>${s.margin.includes(null)?'<p class="note">—：原表为“/”，未提供该平台数据。</p>':''}</section><section class="section"><h2>外卖评分</h2><div class="grid">${cell('美团评分',s.rating[0].toFixed(1))}${cell('淘宝评分',s.rating[1].toFixed(1))}</div></section><section class="section"><h2>存在问题 ${s.issues.length?'<span class="badge">巡店关注</span>':''}</h2>${s.issues.length?`<div class="issue-box">${s.issues.map(x=>`<p>• ${x}</p>`).join('')}</div>`:'<p class="quiet">原表为“/”，未填写问题。</p>'}</section><div class="nav">${i>0?`<a href="#store-${i-1}">‹ 上一家</a>`:''}<a href="#home">全部门店</a>${i<6?`<a href="#store-${i+1}">下一家 ›</a>`:''}</div><p class="note">来源：本次线下巡店门店信息表。未填写问题不代表已完成检查或不存在问题。</p></main>`;bindShare()}
function toast(t){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}
function bindShare(){document.getElementById('share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);toast('链接已复制，可粘贴到微信发送')}catch(e){prompt('长按复制下方链接，在微信中发送：',location.href)}}}
function route(){const m=location.hash.match(/^#store-([0-6])$/);if(m)detail(Number(m[1]));else home();window.scrollTo(0,0)}window.addEventListener('hashchange',route);route();

</script></body></html>
