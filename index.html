function home(){app.innerHTML=header('巡店门店明细','18 家门店 · 广安 / 眉山 / 泸州 / 自贡')+`<main><div class="summary"><div><span class="label">门店总数</span><b>18 家</b></div><div><span class="label">覆盖城市</span><b>4 个</b></div><div><span class="label">巡店批次</span><b>2 批</b></div></div><p class="note">10月巡店：广安、眉山7家（原表未注明年份）。8月巡店：泸州、自贡11家，2026年8月13—15日。各批次统计口径不同，不合计跨批次业绩。</p><div class="toolbar"><input id="search" class="search" placeholder="搜索门店、城市、区县或督导…" aria-label="搜索门店"><div class="filters"><select id="batch" aria-label="巡店批次">${['全部批次','10月巡店','8月巡店'].map(v=>`<option>${v}</option>`).join('')}</select><select id="city" aria-label="城市">${['全部城市','广安','眉山','泸州','自贡'].map(v=>`<option>${v}</option>`).join('')}</select></div></div><div id="count" class="section-heading"></div><div id="list" class="cards"></div><p class="footer">保留原始数据口径 · 点击门店查看完整明细</p></main>`;document.getElementById('search').value=query;document.getElementById('batch').value=batch;document.getElementById('city').value=city;document.getElementById('search').oninput=e=>{query=e.target.value;cards()};document.getElementById('batch').onchange=e=>{batch=e.target.value;cards()};document.getElementById('city').onchange=e=>{city=e.target.value;cards()};cards();share()}
function filtered(){return STORES.filter(s=>(batch==='全部批次'||s.batch===batch)&&(city==='全部城市'||s.city===city)&&`${s.name}${s.city}${s.district}${s.raw?.['所属督导']||'杨凤云'}`.includes(query.trim()))}
function cards(){const list=filtered();document.getElementById('count').textContent=`显示 ${list.length} / 18 家门店`;document.getElementById('list').innerHTML=list.map(s=>`<a class="card" href="#${s.id}"><div class="heading"><h2>${esc(s.name)}</h2><span class="arrow">›</span></div><div class="tags"><span class="tag date">${s.batch}</span><span class="tag">${esc(s.city)} · ${esc(s.district)}</span><span class="tag">${s.date}</span></div><div class="metrics"><div><span class="label">${s.raw?'来源表本月总营收':'上月实收合计'}</span><b>${money(s.raw?s.raw['总业绩-本月营收']:s.delivery+s.dine)}</b></div><div><span class="label">督导</span><b>${esc(s.raw?s.raw['所属督导']:'杨凤云')}</b></div></div><div class="issue-preview ${s.raw||!s.issues.length?'quiet':''}">${s.raw?'含营收环比、会员、成本及推广指标':s.issues.length?esc(s.issues.join('；')):'原表未填写问题'}</div></a>`).join('')||'<div class="empty">没有找到匹配的门店，请更换筛选条件。</div>'}
function section(title,body){return `<section class="section"><h2>${esc(title)}</h2>${body}</section>`}
function fmt(k,v){if(v===null||v==='')return '未提供';if(typeof v!=='number')return esc(v);if(/占比|毛利点/.test(k)){return (v*100).toFixed(2)+(k.includes('环比')?' 个百分点':'%')}return v.toLocaleString('zh-CN',{maximumFractionDigits:4})}
function rawTable(r,keys){return '<table><tbody>'+keys.map(k=>`<tr><td>${esc(k.replace(/\n/g,' '))}</td><td>${fmt(k,r[k])}</td></tr>`).join('')+'</tbody></table>'}
function detail(id){const s=STORES.find(s=>s.id===id);if(!s){home();return}let body='';if(s.raw){const r=s.raw,keys=Object.keys(r),basic=keys.slice(0,13),sales=keys.slice(13,24),members=keys.slice(24,39),cost=keys.slice(39,47),promotion=keys.slice(47,55),expenses=keys.slice(55);const groups=[['门店信息',basic],['营收与业绩占比',sales],['堂食、小程序与会员',members],['成本与利润（来源表口径）',cost],['评分及推广',promotion],['月度开支原始记录',expenses]];body+=`<p class="note">走访：${s.date}。下列“本月 / 上月”沿用来源表，未据此推定具体统计区间。金额单位为元，环比保留原表数值。${!r['城市']?'城市按店名归类为'+s.city+'；原表城市字段未填写。':''}</p>`;for(const [title,ks]of groups){if(ks.length)body+=section(title,rawTable(r,ks))}body+=`<p class="note">“理论净利润”为来源表原值，不代表已扣除房租、人工等全部费用后的实际净利润。原表的0值保留为0，缺失值显示未提供。</p>`;body+=section('巡店补录 · 月度开支',`<p class="note">仅保存在当前设备的当前浏览器，不会同步给其他人；原链接中个人填写的记录无法随公开页面迁入。</p><div class="grid">${['房租','人工','损耗','变动开支'].map((k,i)=>`<label class="cell"><span class="label">${k} / 月（元）</span><input id="exp-${i}" class="expense" type="number" min="0" step="0.01" inputmode="decimal" aria-label="${k}"></label>`).join('')}</div><p id="exp-total" class="total"></p><p id="save-state" class="note"></p>`)}else{body+=section('门店信息',`<div class="grid">${cell('省份 / 城市','四川 / '+s.city)}${cell('区县',s.district)}${cell('走访时间',s.date)}${cell('督导','杨凤云')}</div>`);body+=section('上月业绩',`<div class="grid">${cell('外卖实收',money(s.delivery))}${cell('堂食实收',money(s.dine))}</div><div class="total"><span>实收合计</span><b>${money(s.delivery+s.dine)}</b></div><p class="note">合计由原表实收相加得到。</p>`);body+=section('商圈排名',`<div class="grid">${cell('美团',s.rank[0])}${cell('淘宝',s.rank[1])}</div>`);body+=section('线上毛利 · 10.1—10.20',`<div class="grid">${s.margin.map((v,i)=>cell(['美团','淘宝','京东'][i],v===null?'未提供':v.toFixed(2)+'%')).join('')}</div>`);body+=section('外卖评分',`<div class="grid">${cell('美团',s.rating[0].toFixed(1))}${cell('淘宝',s.rating[1].toFixed(1))}</div>`);body+=section('存在问题',s.issues.length?`<div class="issue-box">${s.issues.map(t=>'<p>• '+esc(t)+'</p>').join('')}</div>`:'<p class="quiet">原表为“/”，未填写问题。</p>');body+='<p class="note">10月资料来源为用户提供的巡店图片，年份未标注。未填写问题不代表不存在问题。</p>'}
const i=STORES.indexOf(s);app.innerHTML=header(s.name,s.batch+' · '+s.city,true)+`<main>${body}<div class="nav">${i?`<a href="#${STORES[i-1].id}">‹ 上一家</a>`:''}<a href="#home">全部门店</a>${i<17?`<a href="#${STORES[i+1].id}">下一家 ›</a>`:''}</div></main>`;share();if(s.raw)initExpenses(s.id)}
function initExpenses(id){const key='sichuan-visit-expenses-'+id;let saved=[];try{saved=JSON.parse(localStorage.getItem(key)||'[]')}catch{};for(let i=0;i<4;i++){const el=document.getElementById('exp-'+i);el.value=saved[i]??'';el.oninput=()=>update(true)}function update(save){const values=[0,1,2,3].map(i=>document.getElementById('exp-'+i).value);document.getElementById('exp-total').textContent='开支合计：'+money(values.reduce((t,x)=>t+(Number(x)||0),0));if(save){try{localStorage.setItem(key,JSON.stringify(values));document.getElementById('save-state').textContent='已保存在当前浏览器'}catch{document.getElementById('save-state').textContent='当前浏览器无法保存，请另行记录'}}}update(false)}
function route(){const id=location.hash.slice(1);if(!id||id==='home')home();else detail(id);window.scrollTo(0,0)}window.addEventListener('hashchange',route);route();
</script></body></html>
